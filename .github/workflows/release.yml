# Build and publish one release: PyPI (Trusted Publishing), the .mcpb bundle, the GitHub Release.
#
# Why this exists (reports/066): releases ran from the maintainer's Windows machine with a
# PyPI token in %USERPROFILE%\.pypirc. That blocks releasing from a Claude Code cloud
# session, because the cloud's network secrets are never attached to pypi.org requests,
# and putting the token in a plain environment variable breaks the rule that keys stay in
# the password manager. PyPI Trusted Publishing removes the token: this workflow proves it
# is gzchenhao/openhire's release.yml (OIDC), the same way publish-mcp-registry.yml does.
#
# One-time setup on PyPI (the maintainer, logged in): project openhire → Publishing →
# Add a trusted publisher → GitHub; owner gzchenhao, repository openhire, workflow
# release.yml, environment pypi.
#
# Manual for now (Actions → Release → Run workflow, give the tag). Once one run has
# succeeded, it can take over from the local twine upload and get a tag trigger; the
# MCP Registry workflow must then run after it, since the Registry checks PyPI.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.8.1 (must already be pushed)"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: The tag must equal pyproject's version, and the bundle must pin it
        id: v
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "${{ inputs.tag }}" = "v$v" || { echo "tag ${{ inputs.tag }} != pyproject v$v"; exit 1; }
          grep -q "\"openhire==$v\"" mcpb/pyproject.toml || { echo "mcpb/pyproject.toml does not pin openhire==$v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Pack the .mcpb and check what it installs
        run: |
          mkdir -p bundle
          npx -y @anthropic-ai/mcpb pack mcpb "bundle/openhire-${{ steps.v.outputs.version }}.mcpb"
          unzip -p "bundle/openhire-${{ steps.v.outputs.version }}.mcpb" pyproject.toml | grep -q "\"openhire==${{ steps.v.outputs.version }}\""

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: bundle/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # the OIDC token PyPI Trusted Publishing exchanges; no stored secret
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true # a version already uploaded by hand is not an error

  github-release:
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      FILE: bundle/openhire-${{ needs.build.outputs.version }}.mcpb
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: bundle/
      - name: Create the release or attach the bundle to it
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$FILE" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
