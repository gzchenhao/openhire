# Deploy the hosted endpoint after each Release, check it daily, and keep a free instance awake.
#
# What is deployed is only the `hosted/` folder: a Dockerfile that installs the RELEASED
# package from PyPI (pinned to pyproject's version by tests/test_release.py) and the restart
# loop. The host builds the image itself; the index is downloaded at start from the public
# snapshot and refreshed in place by the server's own hosted-mode worker.
#
# Two hosts are supported, chosen by which secret exists (the maintainer sets them in
# Settings → Secrets and variables → Actions; nothing here stores a token):
#   - RENDER_DEPLOY_HOOK: the deploy hook URL of the Render web service created from
#     render.yaml (free tier). The hook is POSTed once PyPI has the version.
#   - HF_TOKEN plus the repository variable HF_SPACE (owner/name): hosted/ is pushed to that
#     Space. Needs a PRO account since 2026 (Docker Spaces are no longer free: HTTP 402 on
#     create, run 38672012354), so this path is opt-in through the variable; a token alone
#     does nothing.
# Without a configured host the deploy job says so and stops, green.
#
# The public URL is the repository variable HOSTED_URL (default https://openhire-vlny.onrender.com).
# The daily job asks /healthz and fails loudly (GitHub mails the maintainer) when the host
# does not answer or runs a version other than the released one; both the deploy and the
# daily job then send /mcp an initialize and a tools/list (scripts/hosted_mcp_check.py),
# because /healthz was green while 0.8.15 answered every client with 421. The ten-minute job only
# touches /livez: a free Render instance spins down after 15 idle minutes and takes up to a
# minute to wake, which a ChatGPT connector will not wait for. Both run only once HOSTED_URL
# is set, so a repository without a hosted copy never produces failures or noise.
name: Deploy hosted endpoint

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
    - cron: "*/10 * * * *"

env:
  HOSTED_URL: ${{ vars.HOSTED_URL || 'https://openhire-vlny.onrender.com' }}

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    # Two releases minutes apart (0.8.24 and 0.8.25 on 2026-10-21) each started a deploy run;
    # both asked Render for their own commit and each waited for its own version, so the
    # older run could ask for the older commit again after the newer one was live. The
    # newest deploy cancels the older one; the daily and keep-alive jobs are not in the group.
    concurrency:
      group: deploy-hosted
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
    steps:
      - uses: actions/checkout@v4

      - name: Which host is configured?
        id: gate
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "target=render" >> "$GITHUB_OUTPUT"
          elif [ -n "$HF_TOKEN" ] && [ -n "$HF_SPACE" ]; then
            echo "target=hf" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No host configured (RENDER_DEPLOY_HOOK, or HF_TOKEN with the HF_SPACE variable); the hosted endpoint was not deployed."
            echo "target=none" >> "$GITHUB_OUTPUT"
          fi

      - name: The hosted image must install the released version, and PyPI must have it
        if: steps.gate.outputs.target != 'none'
        id: v
        run: |
          v=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          grep -q "\"openhire==$v\"" hosted/Dockerfile || { echo "hosted/Dockerfile does not pin openhire==$v"; exit 1; }
          # The host's build runs `pip install openhire==$v`, which reads the simple index;
          # that index can trail the JSON API by minutes (0.8.16's first deploy, 19 s after
          # the release, never came up). Wait for both, then give the CDN a minute more.
          for i in $(seq 1 20); do
            if curl -fsS "https://pypi.org/pypi/openhire/$v/json" >/dev/null \
               && curl -fsS -H "Accept: text/html" "https://pypi.org/simple/openhire/" | grep -q "openhire-$v-py3-none-any.whl"; then
              echo "PyPI has $v in the JSON API and the simple index"; sleep 60; exit 0
            fi
            sleep 30
          done
          echo "PyPI does not have openhire $v yet"; exit 1

      - name: "Render: deploy this commit through the deploy hook, and wait for /healthz"
        if: steps.gate.outputs.target == 'render'
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          # Without a commit the hook deploys whatever Render last fetched of the public
          # repository, which can trail a push by many minutes (0.8.16 and 0.8.17 stayed on
          # the previous version for the whole wait). With ref=<sha> (render.com/docs/
          # deploy-a-commit) the hook answers 404 until Render knows the commit. And a build
          # started seconds after a PyPI release can still install the previous version from
          # a CDN edge that has not caught up (0.8.18: the hook was accepted, the host stayed
          # on 0.8.17 for 20 minutes), so a deploy that does not come up is asked for once
          # more before this fails.
          request() {
            for i in $(seq 1 20); do
              code=$(curl -sS -o hook.out -w '%{http_code}' -X POST "${RENDER_DEPLOY_HOOK}&ref=${SHA}" || true)
              case "$code" in
                200|201|202) echo "deploy of $SHA requested: $(cat hook.out)"; return 0 ;;
              esac
              echo "attempt $i: HTTP $code, Render does not know $SHA yet"; sleep 30
            done
            echo "Render never accepted $SHA; asking for its latest commit instead"
            out=$(curl -fsS -X POST "$RENDER_DEPLOY_HOOK") || { echo "the deploy hook did not accept the request"; return 1; }
            echo "deploy requested: $out"
          }
          wait_up() {
            echo "endpoint: $HOSTED_URL/mcp"
            for i in $(seq 1 30); do
              body=$(curl -sS --max-time 30 "$HOSTED_URL/healthz" || true)
              if echo "$body" | grep -q "\"version\": *\"${VERSION}\""; then
                echo "$body"; echo "healthy on ${VERSION}"; return 0
              fi
              echo "attempt $i: $body"; sleep 30
            done
            return 1
          }
          superseded() {
            # A newer release means that release's own run deploys; asking Render for this
            # commit again would roll the host back to it. Only a strictly newer version
            # counts: PyPI's unversioned JSON can trail a release on a CDN edge, and 0.8.27's
            # deploy read 0.8.26 there a minute after the previous step had seen 0.8.27,
            # took "different" for "newer" and stopped without deploying.
            latest=$(curl -fsS https://pypi.org/pypi/openhire/json | python3 -c "import json,sys;print(json.load(sys.stdin)['info']['version'])" 2>/dev/null || true)
            if [ -n "$latest" ] && [ "$latest" != "$VERSION" ] \
               && [ "$(printf '%s\n' "$VERSION" "$latest" | sort -V | tail -n 1)" = "$latest" ]; then
              echo "::notice::PyPI's latest is $latest, newer than $VERSION: that release's own deploy run takes over, so this one stops here."
              return 0
            fi
            return 1
          }
          for round in 1 2; do
            superseded && exit 0
            request || exit 1
            wait_up && exit 0
            echo "round $round: the host did not come up on ${VERSION} within 15 minutes"
          done
          superseded && exit 0
          echo "the host did not come up on ${VERSION} after two deploys"; exit 1

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.target == 'hf'
        with:
          python-version: "3.11"

      - name: "Hugging Face: push hosted/ to the Space (created on first run), then wait for /healthz"
        if: steps.gate.outputs.target == 'hf'
        run: |
          python -m pip install --quiet --upgrade huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ["HF_SPACE"]
          api.create_repo(space, repo_type="space", space_sdk="docker", exist_ok=True, private=False)
          api.upload_folder(folder_path="hosted", repo_id=space, repo_type="space",
                            commit_message=f"openhire {os.environ.get('VERSION', '')}".strip())
          print("pushed hosted/ to", space)
          PY
          for i in $(seq 1 40); do
            body=$(curl -sS --max-time 30 "$HOSTED_URL/healthz" || true)
            if echo "$body" | grep -q "\"version\": *\"${VERSION}\""; then echo "$body"; echo "healthy on ${VERSION}"; exit 0; fi
            echo "attempt $i: $body"; sleep 30
          done
          echo "the host did not come up on ${VERSION} within 20 minutes"; exit 1
        env:
          VERSION: ${{ steps.v.outputs.version }}

      - name: /mcp answers initialize and tools/list like a client sees it
        if: steps.gate.outputs.target != 'none'
        run: python3 scripts/hosted_mcp_check.py "$HOSTED_URL" "${{ steps.v.outputs.version }}"

      - name: The two public pages answer (a third-party site links to /check-company)
        if: steps.gate.outputs.target != 'none'
        run: |
          curl -fsS --max-time 60 "$HOSTED_URL/check-company?from=earlytip" | grep -q "<title>查公司</title>"
          curl -fsS --max-time 60 "$HOSTED_URL/checklist" | grep -q "求职清单"
          curl -fsS --max-time 60 "$HOSTED_URL/check-company.json" | python3 -c "import json,sys;d=json.load(sys.stdin);assert d['schema']==1 and d['title']=='查公司'"
          curl -fsS --max-time 60 "$HOSTED_URL/connect" | grep -q "连接向导"
          echo "pages ok"

  health:
    if: github.event_name == 'schedule' && github.event.schedule == '17 3 * * *' && vars.HOSTED_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: /healthz answers with the released version
        run: |
          v=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          body=$(curl -sS --max-time 90 "$HOSTED_URL/healthz" || true)
          echo "$body"
          echo "$body" | grep -q "\"version\": *\"$v\"" || { echo "hosted endpoint is not answering as $v"; exit 1; }
      - name: /mcp answers initialize and tools/list
        run: python3 scripts/hosted_mcp_check.py "$HOSTED_URL"
      - name: The two public pages answer
        run: |
          curl -fsS --max-time 90 "$HOSTED_URL/check-company" | grep -q "<title>查公司</title>"
          curl -fsS --max-time 90 "$HOSTED_URL/checklist" | grep -q "求职清单"
          curl -fsS --max-time 90 "$HOSTED_URL/check-company.json" | python3 -c "import json,sys;d=json.load(sys.stdin);assert d['schema']==1 and d['title']=='查公司'"
          curl -fsS --max-time 90 "$HOSTED_URL/connect" | grep -q "连接向导"

  warm:
    if: github.event_name == 'schedule' && github.event.schedule == '*/10 * * * *' && vars.HOSTED_URL != ''
    runs-on: ubuntu-latest
    steps:
      - name: Touch /livez so a free instance does not spin down
        run: curl -s -o /dev/null -w "%{http_code}\n" --max-time 90 "$HOSTED_URL/livez" || true
