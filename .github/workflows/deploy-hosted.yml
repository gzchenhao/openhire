# Deploy the hosted endpoint (a Hugging Face Space, Docker SDK) after each Release, and check
# it daily.
#
# What is deployed is only the `hosted/` folder: a Dockerfile that installs the RELEASED
# package from PyPI (pinned to pyproject's version by tests/test_release.py), the restart loop
# and the Space README. The Space builds the image itself. The index is downloaded at start
# from the public snapshot and refreshed in place by the server's own hosted-mode worker.
#
# Needs one repository secret, HF_TOKEN (a Hugging Face token with write access to Spaces),
# set by the maintainer in Settings → Secrets → Actions. Without it the deploy job says so
# and stops; nothing else in this repository depends on it. The Space id can be overridden
# with a repository variable HF_SPACE (default gzchenhao/openhire); its public URL is derived
# (https://<owner>-<name>.hf.space) unless HF_SPACE_URL is set.
#
# The daily job asks /healthz and fails loudly (GitHub mails the maintainer) when the Space
# does not answer or runs a version other than the released one. It also keeps a free Space
# from going to sleep for lack of traffic.
name: Deploy hosted endpoint

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

jobs:
  deploy:
    if: github.event_name != 'schedule' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE || 'gzchenhao/openhire' }}
      HF_SPACE_URL: ${{ vars.HF_SPACE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Is there a token to deploy with?
        id: gate
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::notice::HF_TOKEN is not set in this repository; the hosted endpoint was not deployed."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: The hosted image must install the released version
        if: steps.gate.outputs.deploy == 'true'
        id: v
        run: |
          v=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          grep -q "\"openhire==$v\"" hosted/Dockerfile || { echo "hosted/Dockerfile does not pin openhire==$v"; exit 1; }
          # The release must be on PyPI before the Space builds, or pip inside the build fails.
          for i in $(seq 1 20); do
            if curl -fsS "https://pypi.org/pypi/openhire/$v/json" >/dev/null; then echo "PyPI has $v"; exit 0; fi
            sleep 30
          done
          echo "PyPI does not have openhire $v yet"; exit 1

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.deploy == 'true'
        with:
          python-version: "3.11"

      - name: Push hosted/ to the Space (created on first run)
        if: steps.gate.outputs.deploy == 'true'
        run: |
          python -m pip install --quiet --upgrade huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ["HF_SPACE"]
          api.create_repo(space, repo_type="space", space_sdk="docker", exist_ok=True, private=False)
          api.upload_folder(folder_path="hosted", repo_id=space, repo_type="space",
                            commit_message=f"openhire {os.environ.get('VERSION', '')}".strip())
          print("pushed hosted/ to", space)
          PY
        env:
          VERSION: ${{ steps.v.outputs.version }}

      - name: Wait for the Space to answer /healthz with the released version
        if: steps.gate.outputs.deploy == 'true'
        run: |
          url="${HF_SPACE_URL:-https://$(echo "$HF_SPACE" | tr '/' '-' | tr '[:upper:]' '[:lower:]' | tr '._' '--').hf.space}"
          echo "endpoint: $url/mcp"
          for i in $(seq 1 40); do
            body=$(curl -sS --max-time 30 "$url/healthz" || true)
            if echo "$body" | grep -q "\"version\": *\"${{ steps.v.outputs.version }}\""; then
              echo "$body"; echo "healthy on ${{ steps.v.outputs.version }}"; exit 0
            fi
            echo "attempt $i: $body"; sleep 30
          done
          echo "the Space did not come up on ${{ steps.v.outputs.version }} within 20 minutes"; exit 1

  health:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      HF_SPACE: ${{ vars.HF_SPACE || 'gzchenhao/openhire' }}
      HF_SPACE_URL: ${{ vars.HF_SPACE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: /healthz answers with the released version
        run: |
          if [ -z "${{ secrets.HF_TOKEN }}" ]; then echo "::notice::no HF_TOKEN; no hosted endpoint to check"; exit 0; fi
          v=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          url="${HF_SPACE_URL:-https://$(echo "$HF_SPACE" | tr '/' '-' | tr '[:upper:]' '[:lower:]' | tr '._' '--').hf.space}"
          body=$(curl -sS --max-time 60 "$url/healthz" || true)
          echo "$body"
          echo "$body" | grep -q "\"version\": *\"$v\"" || { echo "hosted endpoint is not answering as $v"; exit 1; }
