# Deploy the hosted endpoint after each Release, check it daily, and keep a free instance awake.
#
# What is deployed is only the `hosted/` folder: a Dockerfile that installs the RELEASED
# package from PyPI (pinned to pyproject's version by tests/test_release.py) and the restart
# loop. The host builds the image itself; the index is downloaded at start from the public
# snapshot and refreshed in place by the server's own hosted-mode worker.
#
# Two hosts are supported, chosen by which secret exists (the maintainer sets them in
# Settings → Secrets and variables → Actions; nothing here stores a token):
#   - RENDER_DEPLOY_HOOK: the deploy hook URL of the Render web service created from
#     render.yaml (free tier). The hook is POSTed once PyPI has the version.
#   - HF_TOKEN plus the repository variable HF_SPACE (owner/name): hosted/ is pushed to that
#     Space. Needs a PRO account since 2026 (Docker Spaces are no longer free: HTTP 402 on
#     create, run 38672012354), so this path is opt-in through the variable; a token alone
#     does nothing.
# Without a configured host the deploy job says so and stops, green.
#
# The public URL is the repository variable HOSTED_URL (default https://openhire.onrender.com).
# The daily job asks /healthz and fails loudly (GitHub mails the maintainer) when the host
# does not answer or runs a version other than the released one; both the deploy and the
# daily job then send /mcp an initialize and a tools/list (scripts/hosted_mcp_check.py),
# because /healthz was green while 0.8.15 answered every client with 421. The ten-minute job only
# touches /livez: a free Render instance spins down after 15 idle minutes and takes up to a
# minute to wake, which a ChatGPT connector will not wait for. Both run only once HOSTED_URL
# is set, so a repository without a hosted copy never produces failures or noise.
name: Deploy hosted endpoint

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
    - cron: "*/10 * * * *"

env:
  HOSTED_URL: ${{ vars.HOSTED_URL || 'https://openhire.onrender.com' }}

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
    steps:
      - uses: actions/checkout@v4

      - name: Which host is configured?
        id: gate
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "target=render" >> "$GITHUB_OUTPUT"
          elif [ -n "$HF_TOKEN" ] && [ -n "$HF_SPACE" ]; then
            echo "target=hf" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No host configured (RENDER_DEPLOY_HOOK, or HF_TOKEN with the HF_SPACE variable); the hosted endpoint was not deployed."
            echo "target=none" >> "$GITHUB_OUTPUT"
          fi

      - name: The hosted image must install the released version, and PyPI must have it
        if: steps.gate.outputs.target != 'none'
        id: v
        run: |
          v=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          grep -q "\"openhire==$v\"" hosted/Dockerfile || { echo "hosted/Dockerfile does not pin openhire==$v"; exit 1; }
          # The host's build runs `pip install openhire==$v`, which reads the simple index;
          # that index can trail the JSON API by minutes (0.8.16's first deploy, 19 s after
          # the release, never came up). Wait for both, then give the CDN a minute more.
          for i in $(seq 1 20); do
            if curl -fsS "https://pypi.org/pypi/openhire/$v/json" >/dev/null \
               && curl -fsS -H "Accept: text/html" "https://pypi.org/simple/openhire/" | grep -q "openhire-$v-py3-none-any.whl"; then
              echo "PyPI has $v in the JSON API and the simple index"; sleep 60; exit 0
            fi
            sleep 30
          done
          echo "PyPI does not have openhire $v yet"; exit 1

      - name: "Render: trigger the deploy hook"
        if: steps.gate.outputs.target == 'render'
        run: |
          out=$(curl -fsS -X POST "$RENDER_DEPLOY_HOOK") || { echo "the deploy hook did not accept the request"; exit 1; }
          echo "deploy requested: $out"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.target == 'hf'
        with:
          python-version: "3.11"

      - name: "Hugging Face: push hosted/ to the Space (created on first run)"
        if: steps.gate.outputs.target == 'hf'
        run: |
          python -m pip install --quiet --upgrade huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ["HF_SPACE"]
          api.create_repo(space, repo_type="space", space_sdk="docker", exist_ok=True, private=False)
          api.upload_folder(folder_path="hosted", repo_id=space, repo_type="space",
                            commit_message=f"openhire {os.environ.get('VERSION', '')}".strip())
          print("pushed hosted/ to", space)
          PY
        env:
          VERSION: ${{ steps.v.outputs.version }}

      - name: Wait for /healthz to answer with the released version
        if: steps.gate.outputs.target != 'none'
        run: |
          echo "endpoint: $HOSTED_URL/mcp"
          for i in $(seq 1 40); do
            body=$(curl -sS --max-time 30 "$HOSTED_URL/healthz" || true)
            if echo "$body" | grep -q "\"version\": *\"${{ steps.v.outputs.version }}\""; then
              echo "$body"; echo "healthy on ${{ steps.v.outputs.version }}"; exit 0
            fi
            echo "attempt $i: $body"; sleep 30
          done
          echo "the host did not come up on ${{ steps.v.outputs.version }} within 20 minutes"; exit 1

      - name: /mcp answers initialize and tools/list like a client sees it
        if: steps.gate.outputs.target != 'none'
        run: python3 scripts/hosted_mcp_check.py "$HOSTED_URL" "${{ steps.v.outputs.version }}"

  health:
    if: github.event_name == 'schedule' && github.event.schedule == '17 3 * * *' && vars.HOSTED_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: /healthz answers with the released version
        run: |
          v=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          body=$(curl -sS --max-time 90 "$HOSTED_URL/healthz" || true)
          echo "$body"
          echo "$body" | grep -q "\"version\": *\"$v\"" || { echo "hosted endpoint is not answering as $v"; exit 1; }
      - name: /mcp answers initialize and tools/list
        run: python3 scripts/hosted_mcp_check.py "$HOSTED_URL"

  warm:
    if: github.event_name == 'schedule' && github.event.schedule == '*/10 * * * *' && vars.HOSTED_URL != ''
    runs-on: ubuntu-latest
    steps:
      - name: Touch /livez so a free instance does not spin down
        run: curl -s -o /dev/null -w "%{http_code}\n" --max-time 90 "$HOSTED_URL/livez" || true
