# Publish server.json to the official MCP Registry.
#
# Why this exists: the interactive `mcp-publisher login github` flow mints a short-lived
# Registry JWT, and it had expired between v0.1.1 and v0.2.0 — leaving the release blocked
# on a human clicking a device code. GitHub Actions OIDC removes that: the workflow proves
# it belongs to this repository, which is exactly what the `io.github.gzchenhao/*`
# namespace requires. No stored token, nothing to expire, nothing to rotate.
#
# Publishes whatever version server.json declares, so bump it in the same commit as the
# PyPI release. Since 0.8.1 it runs after the Release workflow succeeds (the Registry checks
# that the version is on PyPI, so a tag-push trigger raced PyPI and failed), or manually.
name: Publish to MCP Registry

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Release]
    types: [completed]

jobs:
  publish:
    # After Release: only when it succeeded. A Release run for a push that did not change the
    # version also "succeeds" with its publishing jobs skipped; the first step below sees the
    # registry already serving this version and the rest is skipped.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for the OIDC token used by `login github-oidc`
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Already published?
        id: seen
        run: |
          # scripts/registry_state.py exits 0 (flagged latest), 2 (in the registry, flag not
          # yet moved), 1 (absent) or 3 (registry unreadable). A version that is in the
          # registry at all was published: never publish it twice.
          want=$(python3 -c "import json;print(json.load(open('server.json',encoding='utf-8'))['version'])")
          python3 scripts/registry_state.py "$want" && rc=0 || rc=$?
          if [ "$rc" -eq 0 ] || [ "$rc" -eq 2 ]; then echo "done=true" >> "$GITHUB_OUTPUT"; else echo "done=false" >> "$GITHUB_OUTPUT"; fi

      - name: Install mcp-publisher
        if: steps.seen.outputs.done != 'true'
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.0/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher --version

      - name: Validate server.json
        if: steps.seen.outputs.done != 'true'
        run: ./mcp-publisher validate

      - name: Publish
        if: steps.seen.outputs.done != 'true'
        run: |
          set -o pipefail
          ./mcp-publisher login github-oidc
          # "cannot publish duplicate version" means an earlier run already published this
          # version and the step above could not read the registry to see it (the 0.8.8
          # rerun, reports/077): that is success, and the next step verifies it.
          if ./mcp-publisher publish 2>&1 | tee publish.log; then exit 0; fi
          if grep -q "duplicate version" publish.log; then echo "already in the registry; verifying"; exit 0; fi
          exit 1

      - name: Verify the registry now serves this version
        if: steps.seen.outputs.done != 'true'
        run: |
          # The search index lags the publish: 0.8.2 and 0.8.3 "failed" here seconds after a
          # good publish (reports/072), and 0.8.8 served NO isLatest entry at all for over a
          # minute (reports/077). So: poll up to three minutes for the flag; a version that is
          # in the registry but not flagged yet is a warning, not a failure; only "absent"
          # fails, because only that means the publish did not land. 8 x (read + 15 s).
          want=$(python3 -c "import json;print(json.load(open('server.json',encoding='utf-8'))['version'])")
          rc=3
          for i in $(seq 1 8); do
            python3 scripts/registry_state.py "$want" && rc=0 || rc=$?
            if [ "$rc" -eq 0 ]; then exit 0; fi
            sleep 15
          done
          if [ "$rc" -eq 2 ]; then echo "::warning::registry has $want but has not flagged it latest yet"; exit 0; fi
          echo "::error::registry does not serve $want (last state $rc: 1 = absent, 3 = unreadable)"
          exit 1
